name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.25']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
      - name: Build
        run: go build -v ./...
      - name: Test
        run: go test -v -race -coverprofile=coverage.out ./...
      - name: Upload coverage
        if: matrix.go-version == '1.25'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.4
          skip-cache: true

  tui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui/tui
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Test
        run: bun test
      - name: Build
        run: bun run build
      - name: Compile standalone OpenTUI
        run: bun build --compile --format=esm --minify --bytecode src/index.tsx --outfile=../../bin/yokai-tui

  release-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Build snapshot release
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --snapshot --clean
      - name: Verify release archives contain both binaries
        shell: bash
        run: |
          set -euo pipefail

          archive_count=$(find dist -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) | wc -l | tr -d ' ')
          test "$archive_count" -eq 5

          for platform in darwin_amd64 darwin_arm64 linux_amd64 linux_arm64; do
            archive=$(find dist -maxdepth 1 -type f -name "Yokai_*_${platform}.tar.gz" -print -quit)
            test -n "$archive"
            archive_contents=$(tar -tzf "$archive")
            grep -qx 'yokai' <<< "$archive_contents"
            grep -qx 'yokai-tui' <<< "$archive_contents"
          done

          windows_archive=$(find dist -maxdepth 1 -type f -name 'Yokai_*_windows_amd64.zip' -print -quit)
          test -n "$windows_archive"
          windows_contents=$(unzip -Z1 "$windows_archive")
          grep -qx 'yokai.exe' <<< "$windows_contents"
          grep -qx 'yokai-tui.exe' <<< "$windows_contents"

  # This context is required on every long-lived branch. The Firestore suite
  # currently lives on the cloud-sync branches, so keep the context available
  # on main while still failing if a branch contains only a partial suite.
  firestore-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect Firestore rules suite
        id: firestore-suite
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            firebase.json
            firestore.rules
            tests/firebase/package.json
            tests/firebase/package-lock.json
          )
          present=0
          for file in "${required_files[@]}"; do
            if [[ -f "$file" ]]; then
              present=$((present + 1))
            fi
          done

          if [[ "$present" -eq 0 ]]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
          elif [[ "$present" -eq "${#required_files[@]}" ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Firestore rules test suite is incomplete ($present/${#required_files[@]} files present)"
            exit 1
          fi
      - uses: actions/setup-node@v4
        if: steps.firestore-suite.outputs.present == 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/firebase/package-lock.json
      - uses: actions/setup-java@v4
        if: steps.firestore-suite.outputs.present == 'true'
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Firebase test dependencies
        if: steps.firestore-suite.outputs.present == 'true'
        run: npm ci
        working-directory: tests/firebase
      - name: Install Firebase CLI
        if: steps.firestore-suite.outputs.present == 'true'
        run: npm install --global firebase-tools@15.22.4
      - name: Test Firestore security rules
        if: steps.firestore-suite.outputs.present == 'true'
        run: npm test
        working-directory: tests/firebase
      - name: Record unavailable suite
        if: steps.firestore-suite.outputs.present != 'true'
        run: echo "Firestore rules suite is not present on this branch"
