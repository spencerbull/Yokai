name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [develop, staging, main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.25']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
      - name: Build
        run: go build -v ./...
      - name: Test
        run: go test -v -race -coverprofile=coverage.out ./...
      - name: Upload coverage
        if: matrix.go-version == '1.25'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.4
          skip-cache: true

  tui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui/tui
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Test
        run: bun test
      - name: Build
        run: bun run build
      - name: Compile standalone OpenTUI
        run: bun build --compile --format=esm --minify --bytecode src/index.tsx --outfile=../../bin/yokai-tui

  release-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Build snapshot release
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --snapshot --clean
      - name: Verify release archives contain both binaries
        shell: bash
        run: |
          set -euo pipefail

          archive_count=$(find dist -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) | wc -l | tr -d ' ')
          test "$archive_count" -eq 5

          for platform in darwin_amd64 darwin_arm64 linux_amd64 linux_arm64; do
            archive=$(find dist -maxdepth 1 -type f -name "Yokai_*_${platform}.tar.gz" -print -quit)
            test -n "$archive"
            archive_contents=$(tar -tzf "$archive")
            grep -qx 'yokai' <<< "$archive_contents"
            grep -qx 'yokai-tui' <<< "$archive_contents"
          done

          windows_archive=$(find dist -maxdepth 1 -type f -name 'Yokai_*_windows_amd64.zip' -print -quit)
          test -n "$windows_archive"
          windows_contents=$(unzip -Z1 "$windows_archive")
          grep -qx 'yokai.exe' <<< "$windows_contents"
          grep -qx 'yokai-tui.exe' <<< "$windows_contents"

  firestore-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/firebase/package-lock.json
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Firebase test dependencies
        run: npm ci
        working-directory: tests/firebase
      - name: Test provisioning safeguards
        run: bash tests/scripts/setup-common.test.sh
      - name: Install Firebase CLI
        run: npm install --global firebase-tools@15.22.4
      - name: Test Firestore security rules
        run: npm test
        working-directory: tests/firebase
