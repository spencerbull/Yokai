name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  # Skip release job if the commit was made by the release bot (avoid loops)
  check:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - id: check
        run: |
          if [[ "${{ github.event.head_commit.author.username }}" == "github-actions[bot]" ]]; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: check
    if: needs.check.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    environment: firebase-production
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0 # Full history for changelog and version detection
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25'
          cache: true

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Validate release OAuth configuration
        env:
          YOKAI_GOOGLE_CLIENT_ID: ${{ vars.YOKAI_GOOGLE_CLIENT_ID }}
          YOKAI_GOOGLE_CLIENT_SECRET: ${{ vars.YOKAI_GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          [[ -n "${YOKAI_GOOGLE_CLIENT_ID}" ]] || {
            echo "YOKAI_GOOGLE_CLIENT_ID is not configured in firebase-production" >&2
            exit 1
          }
          [[ "${YOKAI_GOOGLE_CLIENT_ID}" =~ ^[0-9]+-[A-Za-z0-9_-]+\.apps\.googleusercontent\.com$ ]] || {
            echo "YOKAI_GOOGLE_CLIENT_ID is not a desktop OAuth client ID" >&2
            exit 1
          }
          [[ -n "${YOKAI_GOOGLE_CLIENT_SECRET}" ]] || {
            echo "YOKAI_GOOGLE_CLIENT_SECRET is not configured in firebase-production" >&2
            exit 1
          }

      # Determine next version from commits since last tag
      - name: Determine version bump
        id: version
        run: |
          # Select the highest release tag even if repository history was
          # rewritten and older tags are no longer ancestors of main.
          LATEST_TAG=$(git tag --list 'v[0-9]*' --sort=-version:refname | head -n 1)
          LATEST_TAG=${LATEST_TAG:-v0.0.0}
          echo "latest_tag=${LATEST_TAG}" >> "$GITHUB_OUTPUT"

          # Parse current version
          VERSION="${LATEST_TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

          # Analyze commits since last tag for conventional commit prefixes
          COMMITS=$(git log "${LATEST_TAG}..HEAD" --pretty=format:"%s" 2>/dev/null || git log --pretty=format:"%s")

          BUMP="patch"
          while IFS= read -r msg; do
            # Major: breaking change
            if echo "$msg" | grep -qiE '^(feat|fix|refactor)!:|BREAKING CHANGE'; then
              BUMP="major"
              break
            fi
            # Minor: new feature
            if echo "$msg" | grep -qiE '^feat(\(.+\))?:'; then
              BUMP="minor"
            fi
          done <<< "$COMMITS"

          case "$BUMP" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac

          NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          echo "new_tag=${NEW_TAG}" >> "$GITHUB_OUTPUT"
          echo "Bump: ${BUMP} (${LATEST_TAG} -> ${NEW_TAG})"

      # Create and push the new tag only after the release configuration passes.
      - name: Create tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.new_tag }}" -m "Release ${{ steps.version.outputs.new_tag }}"
          git push origin "${{ steps.version.outputs.new_tag }}"

      # Build and publish the release
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          YOKAI_GOOGLE_CLIENT_ID: ${{ vars.YOKAI_GOOGLE_CLIENT_ID }}
          YOKAI_GOOGLE_CLIENT_SECRET: ${{ vars.YOKAI_GOOGLE_CLIENT_SECRET }}
